name: Daily Auto Story Generation

on:
  schedule:
    # 每天定時自動執行 (UTC 00:00，即香港時間 08:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 支援手動按鈕觸發

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Human-Style Story Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python auto_story_bot.py

      - name: Commit and Push New Story
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate new story [skip ci]" && git push)
